# Kong in front of the planner. Requires the Docker daemon to be running.
#
# DB-less mode: configuration is the declarative file, no Postgres. Fewer moving
# parts, and the config is reviewable in git — which is most of the reason to
# use a gateway rather than hand-rolling one.
services:
  kong:
    image: kong:3.8
    container_name: atlas-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"     # proxy — point the browser here
      - "8001:8001"     # admin API (read-only in DB-less mode)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach uvicorn on the host
