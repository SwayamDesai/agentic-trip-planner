# Data layer: Postgres and Redis.
#
# Brought up as a separate compose file so the stack is layered — app, then
# data, then LLM gateway, then observability — and any layer can be omitted.
# Nothing uses these yet; Step 1 is about having them healthy and proving the
# app is unaffected either way.
#
#   docker compose -f docker-compose.yml -f compose.data.yml up -d
#
# Three consumers eventually share this Postgres: LiteLLM (virtual keys, spend),
# Langfuse if self-hosted later, and the app's own checkpoints. One database
# server, separate databases — see init/01-databases.sql.
services:
  postgres:
    image: postgres:17-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      # scram-sha-256 for HOST connections, so anything arriving over the
      # container network needs a password. Local (Unix socket) auth stays
      # trust: that socket only exists inside this container, and requiring a
      # password there breaks pg_isready, pg_dump and `make psql` — the first
      # version of this file did exactly that and the healthcheck could never
      # pass.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only
      - ./init:/docker-entrypoint-initdb.d:ro
    # Deliberately NOT published to the host. Only containers on this network
    # can reach it; administer with `docker compose exec postgres psql`.
    expose:
      - "5432"
    healthcheck:
      # `pg_isready` alone returns true while the init scripts are still
      # running, so a dependent service can connect before its database exists.
      # Querying for the database makes the check mean "ready to be used".
      # `pg_isready` alone returns true while the init scripts are still
      # running, so a dependent service can connect before its database
      # exists. Querying the litellm database makes the check mean
      # "initialised and usable".
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d litellm -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s     # let it checkpoint rather than be killed

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    command:
      - redis-server
      # A cache with no memory ceiling grows until the host OOMs. 512MB is
      # generous for this workload and leaves the VM plenty.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # volatile-lru, NOT allkeys-lru. Redis will hold two different kinds of
      # data: cache entries (which carry a TTL and are safe to evict) and
      # rate-limit counters (which do not). allkeys-lru could evict a counter
      # under memory pressure, silently handing a caller a fresh quota.
      # volatile-lru only ever evicts keys that already have an expiry.
      - --maxmemory-policy
      - volatile-lru
      # Rate-limit state is worth surviving a restart; a cache is not, but AOF
      # is cheap at this size and the counters are the reason.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
